# DO Community Playbooks: LEMP on Ubuntu 18.04
##################################################
---
- hosts: Ub2
  become: true
  vars_files:
    - vars/default.yml

  tasks:
    - name: Install db Packages
      apt: name={{ item }} update_cache=yes state=latest
      loop: [ 'mysql-server', 'python3-pymysql' ]
    
    - name: Изменить bind-address в конфиге MySQL
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address\s*=\s*127.0.0.1'
        line: 'bind-address = 0.0.0.0'
        backup: yes

    - name: Изменить mysqlx-bind-address в конфиге MySQL
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^mysqlx-bind-address\s*=\s*127.0.0.1'
        line: 'mysqlx-bind-address = 0.0.0.0'
        backup: yes

 # MySQL Configuration
    - name: restart mysql
      command: service mysql restart

    - name: sleep
      shell: sleep 10

    - name: check status mysql
      command: service mysql status
      register: mysql_service_status

    - name: Debug
      debug:
        var: mysql_service_status

    - name: Sets the root password
      mysql_user:
        name: root
        password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
      ignore_errors: true

    - name: Copy init srcripts
      template:
        src: "script.j2"
        dest: "/home/egor/script.sql"

    - name: Create a new database with name 'bobdata'
      become: false
      mysql_db:
        name: test_db
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
        login_user: root
        login_password: "{{ mysql_root_password }}"
#        login_host: 127.0.0.1:3306

    - name: Импорт SQL файла в базу данных
      become: false
      mysql_db:
        name: test_db                       # Целевая база данных
        state: import                       # Указываем, что нужно импортировать
        target: /home/egor/script.sql       # Путь к SQL файлу на удалённом хосте
        login_user: root
        login_password: "{{ mysql_root_password }}"
#        login_host: 127.0.0.1:3306
        login_unix_socket: /var/run/mysqld/mysqld.sock  # Явно указываем сокет


